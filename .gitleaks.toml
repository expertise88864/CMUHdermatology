# gitleaks 設定（P2-07 秘密掃描）
#
# ★為什麼這個 repo 特別需要它★
# 這支程式手上有：HIS 帳密（打卡）、Gmail App Password（寄信）、院內系統的登入資訊。
# 那些【應該】只存在 `settings/`（已 gitignore），但「應該」不是保證 —— 一次貼錯、
# 一次 `git add -A`，帳密就永久留在 git 歷史裡，而且刪不掉（只能重寫歷史）。
# 秘密外洩是少數「事後補救幾乎無效」的錯誤，所以值得一道自動關卡。

[extend]
useDefault = true

# ─── 允許清單 ────────────────────────────────────────────────────────────────
# ★[2026-07-30 外審第 1 輪] 絕不用【路徑】整片略過★
#   我第一版寫了 `paths = ['^tests/.*\.py$']`，理由是「測試裡有一堆假帳密」。
#   那等於：真的 HIS 帳號或 Gmail App Password 只要貼進任何一支測試檔，
#   就【永遠不會被告警】——連掃完整個 git 歷史也看不到。而路徑本身
#   分辨不出真假帳密。
#   正解是只允許【明確的假值本身】：值變了就會重新告警，這正是我們要的。
[allowlist]
description = "本專案的例外 —— 只允許明確的假值，不允許整個目錄"
regexes = [
  # 設定範本：password 一律是空字串（使用者自己填），不是秘密。
  '''"password"\s*:\s*""''',
  # 公開的寄件信箱（不是憑證；App Password 另外存在 settings/，已 gitignore）。
  '''cmuhdermatology@gmail\.com''',
  # 測試用的假密碼字面值。逐一列出 —— 新增假密碼時要一起加進來，
  # 那個「摩擦」是刻意的：它逼人確認自己加的真的是假值。
  '''"password"\s*:\s*"secret"''',
  '''password="secret"''',
  # 測試用的假 HIS 帳號（A + 9 碼是台灣身分證格式的假資料）。
  '''A123456789''',
  '''OLD_ACCOUNT_1''',
]
paths = [
  # 內嵌的 Python runtime（第三方檔案，不是我們寫的程式碼）
  '''^python_embed/''',
  '''(^|/)\.venv/''',
]
